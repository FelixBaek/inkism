[package]
name = "inkism-sync-relay"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Inkism encrypted sync relay: opaque records, attachment ciphertext, public snapshots, optional owner recovery."

# Wire-compatible port of desktop/internal/relay (Go). Storage is SQLite; an
# old bbolt relay.db is migrated once with desktop/cmd/relay-export and
# `inkism-sync-relay --import-bolt-dump`.

[[bin]]
name = "inkism-sync-relay"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
ego-tree = "0.11"
fs2 = "0.4.3"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = { version = "=0.27.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zeroize = "1"

[profile.release]
debug = false
lto = "thin"
strip = true
