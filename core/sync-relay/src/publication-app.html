<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Inkism 공유 문서</title>
<style>body{max-width:860px;margin:32px auto;padding:20px;font:16px/1.7 system-ui;overflow-wrap:anywhere}nav{display:flex;gap:10px;flex-wrap:wrap}button,input,textarea{font:inherit;padding:8px}textarea{width:95%;min-height:260px}pre{white-space:pre-wrap}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:6px}[hidden]{display:none}#status,#changes{color:#a4261a}#presence{font-size:14px}#drafts{border:1px solid #aaa;padding:12px}</style>
<h1 id="title">공유 문서</h1><form id="unlock"><label>문서 비밀번호 <input id="password" type="password" maxlength="512" autocomplete="current-password"></label><button>열기</button></form><p id="status" role="status"></p><p id="presence" aria-live="polite"></p><p id="changes" aria-live="polite"></p><nav id="pages" aria-label="위키 페이지"></nav><main id="content"></main>
<section id="editor" hidden><h2>공개 사본 편집</h2><p>이 변경은 공유 사본에만 저장됩니다. 서로 다른 문단의 변경은 자동 병합합니다. 같은 문단이나 문서 구조의 동시 변경은 초안을 보존하고 충돌을 알립니다.</p><label>페이지 제목 <input id="editTitle" maxlength="1024"></label><label>본문 HTML <textarea id="editBody"></textarea></label><button id="save">변경 저장</button></section>
<section id="drafts" hidden><p>입력한 초안을 이 탭에 보존했습니다. 페이지 전환이나 원격 변경으로 덮어쓰지 않습니다.</p><button id="download">내 초안 다운로드</button><button id="remote">원격 변경 확인</button><button id="useRemote">초안을 버리고 원격본 사용</button></section><button id="reload">새로고침</button>
<script>
(()=>{
let data=null,password='',current='',authorized=false,loading=null,saving=false,polling=false,composing=false,pendingRender=false,timer,remoteVersion=0;
const $=id=>document.getElementById(id),endpoint=location.pathname,shared=endpoint.startsWith('/s/'),key='inkism-share-drafts:'+endpoint,client=crypto.randomUUID();
const pendingRebases=Object.create(null);let drafts=Object.create(null);try{const stored=JSON.parse(sessionStorage.getItem(key)||'{}');for(const [id,d]of Object.entries(stored)){if(d&&typeof d.title==='string'&&typeof d.html==='string'&&Number.isSafeInteger(d.version))drafts[id]=d;}}catch{}
const headers=()=>({'Accept':'application/json','Content-Type':'application/json','x-share-password-b64':btoa(String.fromCharCode(...new TextEncoder().encode(password)))});
function persist(){try{sessionStorage.setItem(key,JSON.stringify(drafts));}catch{$('status').textContent='초안 저장 공간이 부족합니다. 탭을 닫기 전에 내 초안을 다운로드하세요.';}}
function allPages(){return data?[{id:'',title:data.title,html:data.html},...data.pages]:[];}
function choosePage(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch{}return allPages().find(p=>p.id===id)||allPages()[0];}
function draftStatus(){const count=Object.keys(drafts).length;$('drafts').hidden=!count;$('remote').disabled=!authorized;$('useRemote').disabled=!authorized||!drafts[current];const d=drafts[current];$('changes').textContent=d&&remoteVersion>d.version?'다른 사람이 변경했습니다. 내 초안은 보존되며 이전 버전으로 덮어쓸 수 없습니다. 원격 변경을 확인하세요.':count?`보존된 초안 ${count}개`:data&&remoteVersion>data.version?'새 원격 변경이 있습니다. 선택 영역을 유지하고 있으니 편집란을 벗어나거나 새로고침해 확인하세요.':'';}
function render(){if(!data)return;if(composing){pendingRender=true;return;}const page=choosePage(),samePage=page.id===current,focused=document.activeElement,selection=samePage&&[$('editBody'),$('editTitle')].includes(focused)?{element:focused,value:focused.value,range:[focused.selectionStart,focused.selectionEnd,focused.selectionDirection]}:null;current=page.id;$('title').textContent=page.title;$('content').innerHTML=page.html;for(const a of $('content').querySelectorAll('a[href^="#"]')){const target=allPages().find(p=>'#'+p.id===a.getAttribute('href'));if(target)a.textContent='↗ '+target.title;}$('pages').replaceChildren();for(const p of allPages()){const a=document.createElement('a');a.href='#'+encodeURIComponent(p.id);a.textContent=p.title||'제목 없음';a.setAttribute('aria-current',String(p.id===current));$('pages').append(a);}const d=drafts[current];$('editor').hidden=data.role!=='editor';$('editTitle').value=d?d.title:page.title;const nextBody=d?d.html:page.html;$('editBody').value=nextBody;if(selection&&selection.element.value===selection.value)selection.element.setSelectionRange(...selection.range);draftStatus();}
function capture(){if(!data||data.role!=='editor')return;const previous=drafts[current];drafts[current]={title:$('editTitle').value,html:$('editBody').value,version:previous?previous.version:data.version};persist();draftStatus();}
function unavailable(message){authorized=false;data=null;clearTimeout(timer);$('content').replaceChildren();$('pages').replaceChildren();$('editor').hidden=true;$('presence').textContent='';$('status').textContent=message;draftStatus();}
async function load(){if(loading){await loading;return load();}let finished;loading=new Promise(resolve=>finished=resolve);try{const r=await fetch(endpoint,{headers:headers()});if(!r.ok){if(r.status===401){$('unlock').hidden=false;unavailable('비밀번호를 확인해 주세요.');}else unavailable('공유가 만료되었거나 회수되었습니다. 내 초안은 다운로드할 수 있습니다.');return;}const next=await r.json();data=next;remoteVersion=next.version;authorized=true;$('unlock').hidden=true;render();schedule();}catch{$('status').textContent='연결하지 못했습니다. 내 초안을 유지합니다.';}finally{loading=null;finished();}}
function schedule(){clearTimeout(timer);if(authorized&&shared)timer=setTimeout(heartbeat,document.hidden?15000:3000);}
async function heartbeat(){if(!authorized||!shared||polling)return;polling=true;try{const r=await fetch(endpoint+'/session',{method:'POST',headers:headers(),body:JSON.stringify({client_id:client,page_id:current})});if([401,403,404].includes(r.status)){unavailable('공유가 만료되었거나 회수되었습니다. 내 초안은 다운로드할 수 있습니다.');return;}if(!r.ok)throw Error();const v=await r.json();remoteVersion=v.version;$('presence').textContent=`접속 중 ${v.sessions.length}명 · 현재 페이지 ${v.sessions.filter(p=>p.page_id===current).length}명`;draftStatus();if(data&&v.version!==data.version&&!drafts[current]&&!saving&&!composing&&![$('editBody'),$('editTitle')].includes(document.activeElement))await load();}catch{$('presence').textContent='연결 대기 중 · 내 초안 유지';}finally{polling=false;schedule();}}
// A save may merge a remote paragraph while the author keeps typing in a
// different paragraph. Rebase that extra local input onto the accepted snapshot,
// using complete parsed blocks, and map selections only through unchanged blocks.
function scalar(base,remote,local){if(remote===local||base===local)return remote;if(base===remote)return local;throw Error('overlap');}
function blocks(html){const template=document.createElement('template');template.innerHTML=html;const parts=[...template.content.childNodes].map(n=>{if(n.nodeType===3&&!n.textContent.trim())return ['whitespace',n.textContent];if(n.nodeType===1&&['P','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','PRE','UL','OL','TABLE','HR'].includes(n.tagName))return [n.tagName,n.outerHTML];throw Error('structure');});if(parts.map(p=>p[1]).join('')!==html)throw Error('canonical');return parts;}
function mergeBlocks(base,remote,local){try{return scalar(base,remote,local);}catch{}const b=blocks(base),r=blocks(remote),l=blocks(local);if(b.length!==r.length||b.length!==l.length)throw Error('structure');return b.map((p,i)=>{if(p[0]!==r[i][0]||p[0]!==l[i][0])throw Error('structure');return scalar(p[1],r[i][1],l[i][1]);}).join('');}
function mapSelection(before,after,position){if(before===after)return position;const b=blocks(before),a=blocks(after);if(b.length!==a.length)throw Error('selection structure');let oldOffset=0,newOffset=0;for(let i=0;i<b.length;i++){if(position<=oldOffset+b[i][1].length){if(b[i][1]!==a[i][1])throw Error('selection intersects remote edit');return newOffset+position-oldOffset;}oldOffset+=b[i][1].length;newOffset+=a[i][1].length;}return after.length;}
function rebasePending(pageId){const pending=pendingRebases[pageId],latest=drafts[pageId];if(!pending||!latest)return;if(composing&&pageId===current)return;const {submitted,saved}=pending;if(latest.version!==submitted.version){delete pendingRebases[pageId];return;}try{const title=scalar(submitted.title,saved.merged_page.title,latest.title),html=mergeBlocks(submitted.html,saved.merged_page.html,latest.html),body=$('editBody'),focused=document.activeElement;let selection;if(pageId===current&&focused===body)selection=[mapSelection(latest.html,html,body.selectionStart),mapSelection(latest.html,html,body.selectionEnd),body.selectionDirection];if(pageId===current&&focused===$('editTitle')&&title!==latest.title)throw Error('title selection');drafts[pageId]={title,html,version:saved.version};if(pageId===current){$('editTitle').value=title;body.value=html;if(selection)body.setSelectionRange(...selection);}delete pendingRebases[pageId];persist();}catch{delete pendingRebases[pageId];/* Keep the original version and all local input; never guess an overlapping continuation. */}}
$('editTitle').oninput=capture;$('editBody').oninput=capture;for(const input of [$('editTitle'),$('editBody')]){input.addEventListener('compositionstart',()=>{composing=true;capture();$('save').disabled=true;});input.addEventListener('compositionend',()=>{capture();composing=false;rebasePending(current);$('save').disabled=saving;if(pendingRender){pendingRender=false;render();}});}
$('unlock').onsubmit=e=>{e.preventDefault();password=$('password').value;$('password').value='';$('status').textContent='';load();};$('reload').onclick=load;onhashchange=()=>{if(data)render();};
$('remote').onclick=async()=>{await load();if(authorized)$('status').textContent='위 본문은 최신 원격본입니다. 편집란에는 내 초안을 유지했습니다.';};
$('useRemote').onclick=()=>{if(!authorized||!drafts[current])return;if(!confirm('이 페이지의 초안을 버릴까요? 필요한 내용은 먼저 다운로드하세요.'))return;delete drafts[current];delete pendingRebases[current];persist();render();};
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({drafts},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='inkism-shared-drafts.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('save').onclick=async()=>{if(!data||!authorized||saving||composing)return;capture();const pageId=current,submitted={...drafts[pageId]};saving=true;$('save').disabled=true;try{const r=await fetch(endpoint,{method:'PUT',headers:headers(),body:JSON.stringify({...submitted,page_id:pageId,merge:'blocks-v1'})});if(!r.ok){if([401,403,404].includes(r.status))unavailable('공유가 만료되었거나 회수되었습니다. 내 초안은 다운로드할 수 있습니다.');else $('status').textContent='저장 충돌: 내 초안을 보존했습니다. 원격 변경을 확인하고 병합할 내용을 복사하세요.';return;}const saved=await r.json();const latest=drafts[pageId];if(latest&&latest.title===submitted.title&&latest.html===submitted.html){delete drafts[pageId];delete pendingRebases[pageId];}else if(latest){if(saved.merged&&saved.merged_page){pendingRebases[pageId]={submitted,saved};rebasePending(pageId);}else latest.version=saved.version;}persist();await load();$('status').textContent=drafts[pageId]?'저장했습니다. 저장 중 추가 입력한 초안도 보존했습니다.':'저장했습니다.';}catch{$('status').textContent='저장 결과를 확인하지 못했습니다. 내 초안을 유지합니다. 원격 변경을 확인하세요.';}finally{saving=false;$('save').disabled=composing;draftStatus();}};
window.addEventListener('online',()=>{if(authorized)heartbeat();});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&authorized)heartbeat();});draftStatus();load();
})();
</script></html>
