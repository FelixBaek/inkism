[package]
name = "inkism-pdf-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.82"
description = "One isolated, noninteractive headless-Edge print job (port of the former Go implementation)."

[lib]
name = "inkism_pdf_export"

[dependencies]
tempfile = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
