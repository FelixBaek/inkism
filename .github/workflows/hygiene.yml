name: Repository hygiene
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Keep local-only files out of the public repository
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)(\.gitignore|\.dockerignore|\.env|\.env\..*)$' || true)
          if [ -n "$found" ]; then
            echo "::error::These files must stay local and never be committed:"
            echo "$found"
            exit 1
          fi
      - name: gitleaks (pinned release, checksum checked; reviewed false positives are listed in .gitleaks.toml)
        run: |
          curl -sfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1
