# inkism sync relay: runs behind an existing reverse proxy.
# TLS terminates at the reverse proxy; no external route is provisioned yet.
# Copy .env.example to .env and fill it in before `docker compose up -d`.
services:
  inkism-sync:
    image: inkism-sync-relay:${INKISM_RELAY_VERSION:?set INKISM_RELAY_VERSION in .env}
    build:
      context: .
    command: ["--listen", "0.0.0.0:47832", "--db", "/data/relay.db"]
    environment:
      INKISM_RELAY_TOKEN: ${INKISM_RELAY_TOKEN:?set INKISM_RELAY_TOKEN in .env}
      INKISM_RECOVERY_GOOGLE_CLIENT_ID: ${INKISM_RECOVERY_GOOGLE_CLIENT_ID:-}
      INKISM_RECOVERY_GOOGLE_SUBJECT: ${INKISM_RECOVERY_GOOGLE_SUBJECT:-}
      INKISM_RECOVERY_MASTER_KEY: ${INKISM_RECOVERY_MASTER_KEY:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    expose:
      - "47832"
    volumes:
      - relay-data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${INKISM_PROXY_NETWORK:-inkism_proxy}

volumes:
  relay-data:
