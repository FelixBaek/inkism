[package]
name = "inkism-google-auth"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
publish = false
description = "Google desktop OIDC login, ID-token verification and the account app-lock controller."

[lib]
name = "google_auth"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
zeroize = "1"
httparse = "1"

[target.'cfg(windows)'.dependencies]
inkism-windows-secrets = { path = "../runtime-core/windows-secrets" }

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
tempfile = "3"

# Test-only RSA key generation is unbearably slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
