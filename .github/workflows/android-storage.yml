name: Android encrypted storage restart
on:
  # Register the workflow and exercise only this storage harness on its own branch.
  push:
    branches: ['codex/inkism-backend-completion']
    paths:
      - '.github/workflows/android-storage.yml'
      - 'tools/scripts/android-storage-acceptance.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-storage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Prepare API35 emulator and disposable KVM access
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify storage oracle
        run: python3 tools/scripts/android-storage-acceptance.py --self-test
      - name: Verify existing encrypted storage across process restart
        run: python3 tools/scripts/android-storage-acceptance.py --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/android-storage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-storage-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/android-storage/android-storage.json
            ${{ runner.temp }}/android-storage/apk-provenance.json
            ${{ runner.temp }}/android-storage/emulator.log
