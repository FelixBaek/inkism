name: Native platform artifacts (manual)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build test artifacts; this workflow does not publish releases'
        type: choice
        options: [all, windows, macos, android, ios]
        default: all
permissions:
  contents: read
concurrency:
  group: native-platform-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
      - uses: actions/setup-node@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
      - uses: actions/setup-java@v4
        if: (inputs.platform == 'all' || inputs.platform == 'android') && matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: (inputs.platform == 'all' || inputs.platform == 'android') && matrix.platform == 'android'
      - name: Android SDK and Rust target
        if: (inputs.platform == 'all' || inputs.platform == 'android') && matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: iOS simulator dependencies
        if: (inputs.platform == 'all' || inputs.platform == 'ios') && matrix.platform == 'ios'
        shell: bash
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if [ "$(uname -m)" = arm64 ]; then
            rustup target add aarch64-apple-ios-sim
          else
            rustup target add x86_64-apple-ios
          fi
      - name: Dependencies and frontend
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run build
          npm --prefix desktop-tauri ci --no-audit --no-fund
      - name: Shared native runtime tests
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && matrix.platform != 'android'
        shell: bash
        run: cargo test --locked --manifest-path core/native-host/Cargo.toml --features encrypted-storage
      - name: Build local test artifacts
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        run: node tools/platform-build.mjs '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.platform == 'all' || inputs.platform == matrix.platform)
        with:
          name: inkism-${{ matrix.platform }}-test-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            desktop-tauri/src-tauri/gen/apple/build/**/*.app
            desktop-tauri/src-tauri/gen/apple/build/**/*.ipa
