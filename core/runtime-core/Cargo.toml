[package]
name = "inkism-runtime"
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
description = "Inkism integrated runtime: host change journal, background sync worker, private config; wraps the storage engine."

# The runtime is the process the desktop shell actually
# drives. It owns the storage engine, the durable host journal that makes
# local edits visible to sync, and the background sync worker. The lib exposes
# `AppCore`; the bin is the JSONL
# adapter the Go shell launches.

[lib]
name = "inkism_runtime"
path = "src/lib.rs"

[[bin]]
name = "inkism-engine"
path = "src/main.rs"

[features]
encrypted-storage = ["inkism-storage/encrypted-storage", "inkism-engine/encrypted-storage", "sync-core/encrypted-storage"]

[dependencies]
zeroize = "1"
inkism-storage = { path = "../storage-core" }
inkism-engine = { path = "../engine" }
sync-core = { path = "../sync-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }

tempfile = "3"
fs2 = "0.4.3"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
inkism-windows-secrets = { path = "windows-secrets" }
