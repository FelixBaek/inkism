sonar.issue.ignore.multicriteria.http3.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.http3.resourceKey=desktop/internal/googleauth/client.go

# Google ID tokens are RS256, which is RSASSA-PKCS1-v1_5 by definition (RFC 7518); this verifies, it does not encrypt.
sonar.issue.ignore.multicriteria.rs256.ruleKey=go:S5542
sonar.issue.ignore.multicriteria.rs256.resourceKey=desktop/internal/googleauth/verify.go

# Wrappers that only stop pointer/click events from reaching the canvas; their inputs are the interactive elements.
