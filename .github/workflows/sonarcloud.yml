name: SonarCloud
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  analyze:
    # Fork pull requests get no SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # CI-based analysis so sonar-project.properties (exclusions and reviewed ignores) applies.
      # Coverage is Codecov's job, so it is excluded from the SonarCloud quality gate.
      # New code is measured from the last version change, so tag analyses with the app version.
      - name: Read app version
        id: version
        run: |
          version=$(jq -er '.version | select(type == "string" and length > 0)' desktop-tauri/src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=felixbaek
            -Dsonar.projectKey=FelixBaek_inkism
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.coverage.exclusions=**/*
