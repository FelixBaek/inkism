# gitleaks: real secrets must never be in this repo. Only reviewed false positives are listed here.
[extend]
useDefault = true

[allowlist]
description = "reviewed false positives"
paths = [
  # generated lockfiles list package names such as inkism-windows-secrets
  '''(^|/)Cargo\.lock$''',
]
regexTarget = "line"
regexes = [
  '''per-key full serialization''',
]
