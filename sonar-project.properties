# Loopback-only servers (web clipper upload, local upload) and the RFC 8252 OAuth loopback redirect use plain http by design.
sonar.issue.ignore.multicriteria.http1.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.http1.resourceKey=desktop/internal/bridge/clipper.go
sonar.issue.ignore.multicriteria.http2.ruleKey=go:S5332
