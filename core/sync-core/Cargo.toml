[package]
name = "sync-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Encrypted, incremental, offline-tolerant cross-device sync engine for Inkism. Owns all crypto and sync state."
license = "MIT"

# Design notes:
# * reqwest uses rustls instead of native-tls so a Windows GNU cross build
#   never links OpenSSL (matching the engine build requirements).
# * rusqlite is bundled so the state DB has no system SQLite dependency.
# * chacha20poly1305 provides XChaCha20-Poly1305 (24 byte random nonce).
[features]
encrypted-storage = ["inkism-storage/encrypted-storage"]

[dependencies]
inkism-storage = { path = "../storage-core" }
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
