[package]
name = "inkism-engine"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Inkism SQLite storage/search engine (JSON lines over stdio, library core)"

[lib]
name = "inkism_engine"
path = "src/lib.rs"

[[bin]]
name = "inkism-engine"
path = "src/main.rs"

[features]
encrypted-storage = ["inkism-storage/encrypted-storage"]

[dependencies]
base64 = "0.22"
inkism-storage = { path = "../storage-core" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
scraper = { version = "=0.27.0", default-features = false }
html5ever = "=0.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = false
lto = "thin"
