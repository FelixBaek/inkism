[package]
name = "inkism-native-host"
version = "0.1.0"
edition = "2021"
publish = false

[features]
encrypted-storage = ["inkism-runtime/encrypted-storage", "inkism-engine/encrypted-storage"]

[dependencies]
inkism-local-api = { path = "../local-api" }
inkism-runtime = { path = "../runtime-core" }
inkism-engine = { path = "../engine" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rand = "0.8"
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
