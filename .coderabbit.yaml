# CodeRabbit = AI review of logic, design and intent only.
# Other jobs belong to other tools, so their overlapping scanners are off here:
#   security and secrets -> CodeQL, GitHub secret scanning, Dependabot
#   code quality rules   -> SonarCloud
#   coverage             -> Codecov
language: ko-KR
reviews:
  profile: chill
  auto_review:
    base_branches:
      - "^codex/inkism-backend-completion$"
  poem: false
  in_progress_fortune: false
  path_filters:
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
    - "!**/go.sum"
    - "!frontend/public/fonts/**"
  tools:
    # Security and secrets (CodeQL, secret scanning, Dependabot).
    gitleaks: {enabled: false}
    trufflehog: {enabled: false}
    semgrep: {enabled: false}
    opengrep: {enabled: false}
    osvScanner: {enabled: false}
    trivy: {enabled: false}
    checkov: {enabled: false}
    zizmor: {enabled: false}
    # Rule-based code quality (SonarCloud).
    eslint: {enabled: false}
    biome: {enabled: false}
    oxc: {enabled: false}
    golangci-lint: {enabled: false}
    clippy: {enabled: false}
    stylelint: {enabled: false}
    htmlhint: {enabled: false}
