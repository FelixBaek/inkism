# SonarQube settings. CI: .github/workflows/sonarcloud.yml (SonarCloud). Self-hosted: SONAR_HOST_URL=... SONAR_TOKEN=... sonar-scanner
sonar.projectKey=felix_inkism
sonar.projectName=Inkism
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,.private/**,**/*.lock,frontend/package-lock.json,frontend/public/fonts/**,**/*_test.go,core/*/tests/**,frontend/scripts/**,tools/**

# Findings reviewed and kept on purpose. Each entry says why.
sonar.issue.ignore.multicriteria=u16a,u16b,u16c,key1,key2,key3,key4,cap1,cap2,uri,copy,ctx,contrast,bd1,bd2,bd3,bd4,bd5,bd6,bd7,bd8,dlg1,dlg2,dlg3,role1,role2,role3,role4,tab,keys1,keys2,keys3,keys4,nat1,nat2,nat3,u16d,path1,path2,http1,http2,http3,rs256,frame1,embed,origin

